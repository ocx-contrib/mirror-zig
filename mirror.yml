name: zig
target:
  registry: ocx.sh
  repository: zig

source:
  type: url_index
  generator:
    command: ["uv", "run", "generate.py"]
    timeout_seconds: 240

# Filename ordering changed across releases: 0.14.0 ships
# `zig-<os>-<arch>-<v>` (e.g. zig-linux-x86_64-0.14.0.tar.xz); 0.14.1+ ships
# `zig-<arch>-<os>-<v>` (e.g. zig-x86_64-linux-0.15.1.tar.xz). Both forms are
# matched per platform (newer ordering first). Archive layout is identical
# across orderings, so a single asset_type applies.
# Pass 1 — Linux. Pass 2 — darwin (both arches; macOS ships .tar.xz with the
# same archive layout). windows staged below for Pass 3.
assets:
  linux/amd64:
    - "^zig-x86_64-linux-.*\\.tar\\.xz$"
    - "^zig-linux-x86_64-.*\\.tar\\.xz$"
  linux/arm64:
    - "^zig-aarch64-linux-.*\\.tar\\.xz$"
    - "^zig-linux-aarch64-.*\\.tar\\.xz$"
  darwin/amd64:
    - "^zig-x86_64-macos-.*\\.tar\\.xz$"
    - "^zig-macos-x86_64-.*\\.tar\\.xz$"
  darwin/arm64:
    - "^zig-aarch64-macos-.*\\.tar\\.xz$"
    - "^zig-macos-aarch64-.*\\.tar\\.xz$"
  windows/amd64:
    - "^zig-x86_64-windows-.*\\.zip$"
    - "^zig-windows-x86_64-.*\\.zip$"
  windows/arm64:
    - "^zig-aarch64-windows-.*\\.zip$"
    - "^zig-windows-aarch64-.*\\.zip$"

asset_type:
  type: archive
  strip_components: 1

metadata:
  default: metadata.json

skip_prereleases: true
cascade: true
build_timestamp: none

versions:
  min: "0.14.0"
  new_per_run: 5
  poll_interval: "0 */6 * * *"

concurrency:
  max_downloads: 8
  max_bundles: 4
  max_pushes: 2
  rate_limit_ms: 100
  max_retries: 3
  compression_threads: 0

tests:
  - name: smoke
    script: tests/smoke.star

platforms:
  linux/amd64:
    runner: ubuntu-latest
  linux/arm64:
    runner: ubuntu-24.04-arm
  darwin/amd64:
    # Intel slice tested on the arm64 macos-14 runner via Rosetta 2 (GitHub's
    # macos-13 Intel pool is exhausted and deadlocks the push job).
    runner: macos-14
  darwin/arm64:
    runner: macos-14
  windows/amd64:
    runner: windows-latest
    shell: pwsh
  windows/arm64:
    runner: windows-11-arm
    shell: pwsh

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
    user_id: "227748867204972545"  # pinged in-message on failures
