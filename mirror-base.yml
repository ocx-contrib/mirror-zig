# Shared base for every spec in this repository (ziglang).
#
# NOT a spec: it has no name/target/source and is never loaded on its own.
# Everything a package owns — name, target, source, assets, asset_type,
# metadata, catalog, tests, versions, announce, annotations — stays in that
# package's own mirror.yml.
#
# ⚠️ `extends:` is a SHALLOW merge of top-level keys. A spec that sets a key
# below replaces that block OUTRIGHT — there is no per-key merge. `platforms:`
# is where this bites: it carries BOTH the runner matrix and the container
# legs, so a child that restates it to tweak one runner silently drops every
# `containers:` entry. Nothing reds — the legs simply stop existing, and every
# os.features claim in that spec goes back to being merely asserted. Restate
# `platforms:` IN FULL or not at all.

skip_prereleases: true
cascade: true

# Carried over unchanged from the flat `ocx.sh/zig` coordinate this repo
# published before the grouped layout.
#
# `ocx-mirror package validate` WARNS on this (`none` + `cascade`): re-pointing
# a cascade tag orphans the prior digest, which registry GC can reap and break
# a consumer's `@sha256:` pin. The exposure is narrow here — upstream Zig
# versions are bare semver and ziglang.org's index is append-only per release,
# so a given `X.Y.Z` tag is written once and only the rolling cascade aliases
# ever move (inherent to cascading, and equally true under `date`).
#
# Nothing is published at `ghcr.io/ocx-contrib/ziglang/zig` yet, so switching
# to the `date` fleet default costs no orphaned digest — it is a one-line
# change here whenever that is wanted.
build_timestamp: none

# No `verify:` block. `github_asset_digest` is a github_release-source option
# and this repo's only source is `url_index` — Zig ships no GitHub release
# assets at all (the GitHub repo moved to Codeberg). The ziglang.org index does
# publish a `shasum` per tarball, but there is no `checksums_file` document to
# point at. Downloads are HTTPS from ziglang.org / its release CDN.

concurrency:
  # Zig tarballs are ~45-60 MB compressed and expand to a ~250 MB tree (the
  # whole stdlib plus the bundled C/C++ headers), so each bundle re-compresses
  # far more than a single-binary CLI mirror. Limits sit between the
  # single-binary fleet default and the JDK-sized mirrors.
  max_downloads: 8
  max_bundles: 4
  max_pushes: 2
  rate_limit_ms: 100
  max_retries: 3
  compression_threads: 0

# `off`, and it cannot be otherwise here. The scan only looks BELOW an
# interface PATH entry of the form ${installPath}/<dir>. Zig's archive puts the
# `zig` executable AT the content root, beside the `lib/` stdlib tree and
# `doc/`, so PATH is a bare ${installPath} and `auto`/`verify` is rejected at
# spec load with exit 65 ("bin_scan is enabled but … declares no
# interface-visible ${installPath}/<dir> PATH entry"). `off` plus a hand-listed
# `binaries` in zig/metadata.json is the blessed shape — and the right answer
# anyway: `auto` would walk `lib/`, whose stdlib and bundled libc sources carry
# exec bits in the tarball, and claim them as interface binaries.
#
# A future package here that ships an archive with a real bin/ dir should
# override this to `verify`.
bin_scan: off

# ─── Platform matrix ────────────────────────────────────────────────────────
#
# `os.features` states what an artifact REQUIRES OF THE HOST — it is not a
# label for how it was built. Zig's Linux tarballs are self-hosted static
# builds: byte-measured 2026-08-01 on `zig` from both arches' tarballs, neither
# carries a PT_INTERP or a single DT_NEEDED (evidence above zig/mirror.yml's
# `assets:`). Upstream publishes no musl/glibc split to choose between, so both
# Linux keys are BARE. Tagging them `+libc.musl` would be a false requirement
# that hid them from every glibc host.
#
# A bare key claims universality, so it must prove it: ubuntu (glibc) + alpine
# (musl) + fedora (different glibc vintage). The alpine leg IS the proof —
# drop it and the universal claim is merely asserted.
#
# A future package here whose libc measurement differs must restate this whole
# block in its own spec — see the shallow-merge warning at the top.
platforms:
  linux/amd64:
    runner: ubuntu-latest
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  linux/arm64:
    # arm64 container legs run natively — no qemu — so the runner arch must
    # match the platform or the renderer reds the leg up front.
    runner: ubuntu-24.04-arm
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  darwin/amd64:
    # Intel slice tested on the arm64 macos-14 runner via Rosetta 2 — GitHub's
    # native macos-13 Intel pool is exhausted and deadlocks the push job.
    runner: macos-14
    prefix: ["arch", "-x86_64"]
  darwin/arm64:
    runner: macos-14
    shell: bash
  windows/amd64:
    runner: windows-latest
    shell: pwsh
  windows/arm64:
    # Native arm64 Windows runner — the amd64 pool cannot execute an ARM64 PE.
    runner: windows-11-arm
    shell: pwsh
    exclude:
      - version: "0.16.0"
        reason: "aarch64-windows build-exe segfault"
        severity: broken
  # No `containers:` on darwin or windows — those runners have no Linux
  # container engine, and the key is rejected at spec load.

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
    user_id: "227748867204972545"  # pinged in-message on failures
